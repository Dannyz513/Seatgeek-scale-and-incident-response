<svg width="100%" viewBox="0 0 760 590" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Detailed SeatGeek-style platform architecture with VPC, Availability Zones, and incident response flow</title>
<desc>A user request enters through an Internet Gateway to an Application Load Balancer spanning two Availability Zones, each with a private subnet running an EC2 instance. CloudWatch monitors the platform and, on an alarm, both logs a permanent incident via Lambda to DynamoDB and notifies an on-call engineer via SNS.</desc>
<defs>
<marker id="arrowGrey2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowRed2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrowWhite2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

